# Builds the jar with the trade-screen fix for a private modpack. Not part of the fix itself (that is the branch
# fix/trade-screen-missing-mob, offered upstream).
name: dsw-build
on:
  push:
    branches: [dsw-build]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle build --no-daemon
      - run: sha512sum build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: mowziesmobs-jar
          path: build/libs/*.jar
